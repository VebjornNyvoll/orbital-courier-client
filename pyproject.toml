[project]
name = "orbital-courier-client"
version = "1.0.0"
description = "Lag et CLI med Typer"
requires-python = ">=3.12"
dependencies = ["typer>=0.16,<1", "httpx>=0.27,<1", "rich>=13,<15"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["verktoy/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

